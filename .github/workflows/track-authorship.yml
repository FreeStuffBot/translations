name: Track Translation Authorship

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'discord-bot/*.jsonc'

permissions:
  contents: write  # required to push the updated registry back

jobs:
  update-authorship:
    runs-on: ubuntu-latest

    # Skip if:
    #  - The commit message contains [skip-authors]  (formatting/auto-fix runs)
    #  - The actor is the actions bot itself          (prevents infinite loop)
    if: |
      !contains(github.event.head_commit.message, '[skip-authors]') &&
      github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout (with history for diff)
        uses: actions/checkout@v4
        with:
          # fetch-depth 2 so we can diff HEAD vs HEAD~1
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install script dependencies
        run: bun install
        working-directory: scripts

      - name: Run authorship tracking script
        run: node scripts/update-authorship.js
        run: bun update-authorship.ts
        working-directory: scripts
        env:
          # The committer who pushed – this is the author entry written to the registry
          AUTHOR_NAME:  ${{ github.event.head_commit.author.name }}
          AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
          GIT_HASH:     ${{ github.event.head_commit.id }}

      - name: Commit updated registry (if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add authorship-registry.json
          # Only create a commit if the registry file actually changed
          git diff --staged --quiet || \
            git commit -m "chore: update authorship registry [skip-authors]"
          git push

